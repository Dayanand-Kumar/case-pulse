<main class="login-shell">
  <form class="login-card" (ngSubmit)="submit()" autocomplete="on">
    <div class="login-brand">Case<span>Pulse</span></div>
    <h1>Sign in</h1>
    <p class="login-hint">Use your CasePulse account. Access depends on your role.</p>
    <label for="login-username">Username</label>
    <input id="login-username" name="username" type="text" [(ngModel)]="username" autocomplete="username" required autofocus />
    <label for="login-password">Password</label>
    <input id="login-password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required />
    @if (error()) { <div class="login-error" role="alert">{{ error() }}</div> }
    <button type="submit" [disabled]="submitting() || !username.trim() || !password">{{ submitting() ? 'Signing in…' : 'Sign in' }}</button>
  </form>
</main>
